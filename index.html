
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReWear | Second Life</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f5;color:#171717}
header{background:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.logo{font-size:27px;font-weight:800}
header a{color:#171717;text-decoration:none;margin-left:18px}
main{max-width:1200px;margin:30px auto;padding:0 18px}
h1{font-size:34px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.filters button{border:1px solid #ddd;border-radius:25px;background:white;padding:12px 20px;cursor:pointer}
.filters button.active,.buy{background:#111;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid #ddd;border-radius:13px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:230px;object-fit:contain;background:#eee}
.info{padding:14px}
.info small{color:#666}
.info h3{margin:8px 0}
.price{font-size:20px;font-weight:bold}
.condition{font-size:13px;color:#666;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:15px}
.modal-box{background:white;width:100%;max-width:850px;max-height:95vh;overflow:auto;border-radius:18px;padding:20px}
.modal-top{display:flex;justify-content:space-between;align-items:center}
.close{border:0;border-radius:50%;padding:12px;cursor:pointer;font-size:20px}
.big-photo{width:100%;height:360px;object-fit:contain;background:#f0f0ee;border-radius:12px}
.angles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.angle{border:2px solid transparent;border-radius:10px;background:#f2f2f0;padding:5px;cursor:pointer}
.angle.active{border-color:#111}
.angle img{width:100%;height:100px;object-fit:contain}
.angle span{display:block;font-size:13px;padding:5px}
@media(max-width:700px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card img{height:170px}
 .big-photo{height:280px}
 .angles{gap:5px}
 .angle img{height:65px}
 .angle span{font-size:11px}
}
@media(max-width:420px){
 .grid{grid-template-columns:1fr 1fr}
 header a{margin-left:8px;font-size:13px}
}
</style>
</head>

<body>
<header>
  <div class="logo">ReWear</div>
  <nav><a href="#shop">Shop</a><a href="#shop">Items</a></nav>
</header>

<main id="shop">
  <h1>Shop items</h1>
  <p>Choose a category, then select a product to see its four angles.</p>

  <div class="filters" id="filters">
    <button class="active" data-category="All">All</button>
    <button data-category="Caps">Caps</button>
    <button data-category="Hoodies">Hoodies</button>
    <button data-category="Watches">Watches</button>
    <button data-category="Shoes">Shoes</button>
  </div>

  <div class="grid" id="products"></div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-top">
      <div>
        <h2 id="modalName">Product</h2>
        <p id="modalCondition"></p>
      </div>
      <button class="close" id="close" aria-label="Close">✕</button>
    </div>

    <img class="big-photo" id="bigPhoto" alt="Selected product angle">

    <div class="angles" id="angles"></div>
    <h2 id="modalPrice"></h2>
  </div>
</div>

<script>
/*
  IMPORTANT:
  Har product ke front, back, left aur right ke liye
  alag image file rakho. Neeche filenames ke examples hain.
  Images ko GitHub repository mein "images" folder ke andar upload karo.
*/
const items = [
  {
    name:"White Everyday Cap",category:"Caps",price:800,condition:"Good",
    photos:[
      "images/cap1-front.jpg",
      "images/cap1-back.jpg",
      "images/cap1-left.jpg",
      "images/cap1-right.jpg"
    ]
  },
  {
    name:"Black Classic Cap",category:"Caps",price:900,condition:"Like New",
    photos:[
      "images/cap2-front.jpg",
      "images/cap2-back.jpg",
      "images/cap2-left.jpg",
      "images/cap2-right.jpg"
    ]
  },
  {
    name:"Grey Street Cap",category:"Caps",price:700,condition:"Good",
    photos:[
      "images/cap3-front.jpg",
      "images/cap3-back.jpg",
      "images/cap3-left.jpg",
      "images/cap3-right.jpg"
    ]
  },
  {
    name:"Grey Comfort Hoodie",category:"Hoodies",price:2200,condition:"Good",
    photos:[
      "images/hoodie1-front.jpg",
      "images/hoodie1-back.jpg",
      "images/hoodie1-left.jpg",
      "images/hoodie1-right.jpg"
    ]
  },
  {
    name:"Black Everyday Hoodie",category:"Hoodies",price:2500,condition:"Like New",
    photos:[
      "images/hoodie2-front.jpg",
      "images/hoodie2-back.jpg",
      "images/hoodie2-left.jpg",
      "images/hoodie2-right.jpg"
    ]
  },
  {
    name:"Navy Zip Hoodie",category:"Hoodies",price:2000,condition:"Good",
    photos:[
      "images/hoodie3-front.jpg",
      "images/hoodie3-back.jpg",
      "images/hoodie3-left.jpg",
      "images/hoodie3-right.jpg"
    ]
  },
  {
    name:"Minimal Classic Watch",category:"Watches",price:3500,condition:"Good",
    photos:[
      "images/watch1-front.jpg",
      "images/watch1-back.jpg",
      "images/watch1-left.jpg",
      "images/watch1-right.jpg"
    ]
  },
  {
    name:"Steel Everyday Watch",category:"Watches",price:4000,condition:"Like New",
    photos:[
      "images/watch2-front.jpg",
      "images/watch2-back.jpg",
      "images/watch2-left.jpg",
      "images/watch2-right.jpg"
    ]
  },
  {
    name:"Leather Strap Watch",category:"Watches",price:3800,condition:"Good",
    photos:[
      "images/watch3-front.jpg",
      "images/watch3-back.jpg",
      "images/watch3-left.jpg",
      "images/watch3-right.jpg"
    ]
  },
  {
    name:"Red Street Sneakers",category:"Shoes",price:4500,condition:"Good",
    photos:[
      "images/shoes1-front.jpg",
      "images/shoes1-back.jpg",
      "images/shoes1-left.jpg",
      "images/shoes1-right.jpg"
    ]
  },
  {
    name:"Classic White Sneakers",category:"Shoes",price:5000,condition:"Like New",
    photos:[
      "images/shoes2-front.jpg",
      "images/shoes2-back.jpg",
      "images/shoes2-left.jpg",
      "images/shoes2-right.jpg"
    ]
  },
  {
    name:"Black Sport Shoes",category:"Shoes",price:3900,condition:"Good",
    photos:[
      "images/shoes3-front.jpg",
      "images/shoes3-back.jpg",
      "images/shoes3-left.jpg",
      "images/shoes3-right.jpg"
    ]
  }
];

const labels = ["Front","Back","Left Side","Right Side"];
const products = document.getElementById("products");
const modal = document.getElementById("modal");
let selectedCategory = "All";

function renderProducts(){
  products.innerHTML = "";

  items.forEach((item,index)=>{
    if(selectedCategory !== "All" &&
       item.category !== selectedCategory) return;

    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.src = item.photos[0];
    img.alt = item.name + " front view";

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML =
      `<small>${item.category}</small>
       <h3>${item.name}</h3>
       <div class="price">PKR ${item.price.toLocaleString()}</div>
       <div class="condition">Condition: ${item.condition}</div>`;

    card.append(img,info);
    card.addEventListener("click",()=>openProduct(index));
    products.appendChild(card);
  });
}

function openProduct(index){
  const item = items[index];

  document.getElementById("modalName").textContent = item.name;
  document.getElementById("modalCondition").textContent =
    "Condition: " + item.condition;
  document.getElementById("modalPrice").textContent =
    "PKR " + item.price.toLocaleString();

  const bigPhoto = document.getElementById("bigPhoto");
  bigPhoto.src = item.photos[0];
  bigPhoto.alt = item.name + " - Front";

  const angles = document.getElementById("angles");
  angles.innerHTML = "";

  item.photos.forEach((photo,photoIndex)=>{
    const button = document.createElement("button");
    button.className = "angle" + (photoIndex===0 ? " active" : "");

    const img = document.createElement("img");
    img.src = photo;
    img.alt = item.name + " - " + labels[photoIndex];

    const span = document.createElement("span");
    span.textContent = labels[photoIndex];

    button.append(img,span);

    button.addEventListener("click",()=>{
      bigPhoto.src = photo;
      bigPhoto.alt = item.name + " - " + labels[photoIndex];

      angles.querySelectorAll(".angle").forEach(b=>
        b.classList.remove("active")
      );
      button.classList.add("active");
    });

    angles.appendChild(button);
  });

  modal.style.display = "flex";
}

document.querySelectorAll("#filters button").forEach(button=>{
  button.addEventListener("click",()=>{
    selectedCategory = button.dataset.category;
    document.querySelectorAll("#filters button").forEach(b=>
      b.classList.remove("active")
    );
    button.classList.add("active");
    renderProducts();
  });
});

document.getElementById("close").addEventListener("click",()=>{
  modal.style.display = "none";
});

modal.addEventListener("click",event=>{
  if(event.target === modal) modal.style.display = "none";
});

document.addEventListener("keydown",event=>{
  if(event.key === "Escape") modal.style.display = "none";
});

renderProducts();
</script>
</body>
</html>
